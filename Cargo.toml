[workspace]
members = [
    ".",
    "crates/frontend-web",
    "crates/shared",
]
resolver = "2"

[workspace.package]
edition = "2024"
authors = ["Nemo"]
license = "AGPL-3.0"
rust-version = "1.95.0"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
ulid = { version = "1", features = ["serde"] }

[package]
name = "mithic-backend"
version = "0.1.0"
edition.workspace = true
authors.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
tokio = { version = "1", features = ["full"] }
axum = { version = "0.8", features = ["macros"] }
serde.workspace = true
serde_json.workspace = true
tower = { version = "0.5", features = ["full"] }
tower-http = { version = "0.6", features = ["cors", "trace", "compression-gzip"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
chrono.workspace = true
uuid = { version = "1", features = ["v4", "serde"] }
ulid.workspace = true
anyhow = "1"
validator = { version = "0.20", features = ["derive"] }
jsonwebtoken = "10"
argon2 = "0.5"
rand = "0.10"
regex = "1"
once_cell = "1"
dotenvy = "0.15"
config = "0.15"
redis = { version = "1.2", features = ["tokio-comp", "connection-manager"] }
tokio-util = "0.7"
futures = "0.3"
async-trait = "0.1"
bytes = "1"
http = "1"
reqwest = { version = "0.13", features = ["json"] }
url = { version = "2", features = ["serde"] }
mime = "0.3"
tempfile = "3"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp", "gif"] }
base64 = "0.22"
sha2 = "0.11"
hex = "0.4"
secrecy = "0.10"
openssl = "0.10"

# Internationalization
fluent = "0.17"
unic-langid = { version = "0.9", features = ["macros"] }

# HTTP Signatures for ActivityPub
sigh = "1.0.3"

# MFM Parser
pest = "2"
pest_derive = "2"

# WebSocket (axum 0.8 built-in WebSocket used; tokio-tungstenite is NOT used per architecture spec)
futures-util = "0.3"

# Web Push
web-push = "0.11"

# Database
surrealdb = { version = "3", features = ["protocol-ws", "kv-mem"] }

# Migration tool dependencies (optional)
sqlx = { version = "0.8", features = ["postgres", "runtime-tokio", "tls-native-tls", "chrono", "json", "uuid"], optional = true }
clap = { version = "4", features = ["derive", "env"], optional = true }

[features]
default = []
migration = ["sqlx", "clap"]

[[bin]]
name = "mithic"
path = "backend/src/main.rs"

[[bin]]
name = "migrate"
path = "backend/src/bin/migrate.rs"
required-features = ["migration"]

[dev-dependencies]
tokio-test = "0.4"

[workspace]
members = [
    "backend",
    "shared",
    "frontend",
]
resolver = "2"

[workspace.package]
edition = "2024"
authors = ["Nemo"]
license = "AGPL-3.0"
rust-version = "1.88.0"

[workspace.dependencies]
# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Time
chrono = { version = "0.4", features = ["serde"] }

# ID generation
ulid = { version = "3", features = ["serde"] }

# Async runtime
tokio = { version = "1", features = ["full"] }
futures = "0.3"
futures-util = "0.3"

# Web framework
axum = { version = "0.8", features = ["macros", "multipart", "ws"] }
tower = { version = "0.5", features = ["full"] }
tower-http = { version = "0.7", features = ["cors", "trace", "compression-gzip"] }

# Database
surrealdb = { version = "3", features = ["protocol-ws", "kv-mem"] }
redis = { version = "1.2", features = ["tokio-comp", "connection-manager"] }
object_store = { version = "0.14.1", features = ["aws", "gcp"] }

# HTTP client
reqwest = { version = "0.13", features = ["json"] }

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Error handling
anyhow = "1"

# Config
dotenvy = "0.15"

# Auth
jsonwebtoken = { version = "11", features = ["rust_crypto"] }
argon2 = "0.6"
rand = "0.10"
totp-rs = { version = "6", features = ["gen_secret", "otpauth"] }

regex = "1"

# Internationalization
fluent = "0.17"
unic-langid = { version = "0.9", features = ["macros"] }

# Utilities
bytes = "1"
http = "1"
url = { version = "2", features = ["serde"] }
mime = "0.3"
tempfile = "3"
base64 = "0.23"
sha2 = "0.11"
hex = "0.4"
rsa = { version = "0.9", features = ["sha2", "pem"] }

# Web Push
web-push = { version = "0.11", features = ["isahc-client"] }

# Image processing (thumbnails). Pin <0.25.10 for MSRV 1.85 (0.25.10 needs 1.88).
image = { version = "=0.25.6", default-features = false, features = ["png", "jpeg", "webp", "gif"] }

# Background Jobs
apalis = { version = "0.7", features = ["retry", "limit"] }
apalis-redis = { version = "0.7" }

# Memory allocator (server)
mimalloc = "0.1"

# Internal crates
shared = { path = "shared" }

# リリースビルド最適化
[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 16
strip = true

# WASM フロントエンドはバイナリサイズ優先
[profile.release.package.frontend]
opt-level = "z"

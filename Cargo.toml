[workspace]
members = [
    "config",
    "mfm",
    "i18n",
    "db",
    "core",
    "federation",
    "stream",
    "api",
    "server",
    "worker",
    "frontend-web",
    "shared",
]
resolver = "2"

[workspace.package]
edition = "2024"
authors = ["Nemo"]
license = "AGPL-3.0"
rust-version = "1.85.0"

[workspace.dependencies]
# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Time
chrono = { version = "0.4", features = ["serde"] }

# ID generation
ulid = { version = "1", features = ["serde"] }
uuid = { version = "1", features = ["v4", "serde"] }

# Async runtime
tokio = { version = "1", features = ["full"] }
futures = "0.3"
futures-util = "0.3"
async-trait = "0.1"
tokio-util = "0.7"

# Web framework
axum = { version = "0.8", features = ["macros", "multipart", "ws"] }
tower = { version = "0.5", features = ["full"] }
tower-http = { version = "0.6", features = ["cors", "trace", "compression-gzip"] }

# Database
surrealdb = { version = "3", features = ["protocol-ws", "kv-mem"] }
redis = { version = "1.2", features = ["tokio-comp", "connection-manager"] }

# HTTP client
reqwest = { version = "0.13", features = ["json"] }

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Error handling
anyhow = "1"

# Config
dotenvy = "0.15"
secrecy = "0.10"

# Auth
jsonwebtoken = "10"
argon2 = "0.5"
rand = "0.10"

# ActivityPub
sigh = "1.0.3"

# MFM
pest = "2"
pest_derive = "2"
regex = "1"
once_cell = "1"

# Internationalization
fluent = "0.17"
unic-langid = { version = "0.9", features = ["macros"] }

# Utilities
bytes = "1"
http = "1"
url = { version = "2", features = ["serde"] }
mime = "0.3"
tempfile = "3"
base64 = "0.22"
sha2 = "0.11"
hex = "0.4"
rsa = { version = "0.9", features = ["sha2", "pem"] }
validator = { version = "0.20", features = ["derive"] }

# Web Push
web-push = "0.11"

# Memory allocator (server/worker)
mimalloc = "0.1"

# Image processing
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp", "gif"] }

# Internal crates
mithic-config     = { path = "config" }
mithic-mfm        = { path = "mfm" }
mithic-i18n       = { path = "i18n" }
mithic-db         = { path = "db" }
mithic-core       = { path = "core" }
mithic-federation = { path = "federation" }
mithic-stream     = { path = "stream" }
mithic-api        = { path = "api" }
shared            = { path = "shared" }

# リリースビルド最適化 (TODO Phase 0 / P-1)
[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = true

# WASM フロントエンドはバイナリサイズ優先
[profile.release.package.frontend-web]
opt-level = "z"

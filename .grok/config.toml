# Project MCP: HTTP/OAuth only. Host CLI MCP (headroom/serena/uvx) lives in ~/.grok/config.toml.

[mcp_servers.cloudflare-docs]
url = "https://docs.mcp.cloudflare.com/mcp"
enabled = true

[mcp_servers.cloudflare-api]
url = "https://mcp.cloudflare.com/mcp"
enabled = true

[mcp_servers.cloudflare-bindings]
url = "https://bindings.mcp.cloudflare.com/mcp"
enabled = true

[mcp_servers.cloudflare-builds]
url = "https://builds.mcp.cloudflare.com/mcp"
enabled = true

[mcp_servers.cloudflare-observability]
url = "https://observability.mcp.cloudflare.com/mcp"
enabled = true

[mcp_servers.awsknowledge]
url = "https://knowledge-mcp.global.api.aws"
enabled = true

[mcp_servers.context7]
url = "https://mcp.context7.com/mcp/oauth"
enabled = true

[mcp_servers.github]
url = "https://api.githubcopilot.com/mcp/x/all"
enabled = true

[mcp_servers.notion]
url = "https://mcp.notion.com/mcp"
enabled = true

# Mithic — reverse proxy + static SPA (nginx)
# docker-compose の proxy サービスが /etc/nginx/conf.d/default.conf にマウントする。

upstream mithic_backend {
    server backend:3000;
    keepalive 16;
}

# OGP ボット（Caddyfile の header_regexp と同じ一式）
map $http_user_agent $ogp_bot {
    default 0;
    "~*(?i)(discordbot|twitterbot|slackbot|telegrambot|whatsapp|googlebot|bingbot|facebot|facebookexternalhit|baiduspider|yandexbot)"  1;
}

# WebSocket upgrade（Upgrade ヘッダーが無ければ close）
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;                # Docker の published port は IPv4 DNAT なので 0.0.0.0 で足りる
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    access_log /dev/stdout;
    error_log  /dev/stderr warn;

    gzip on;
    # text/html は gzip 既定で対象なので gzip_types には書かない（重複警告になる）
    gzip_types text/css application/javascript application/json image/svg+xml application/wasm font/woff2;
    gzip_min_length 1024;
    gzip_vary on;

    # ---- REST API + WebSocket (/api/v1/streaming) ----
    # 既定の proxy_read_timeout 60s だとアイドル WS が切れるので長めに取る
    location /api/ {
        proxy_pass http://mithic_backend;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        $connection_upgrade;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # ---- Drive blobs ----
    location /uploads/ {
        proxy_pass http://mithic_backend;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ---- ActivityPub / Federation ----
    location ~ ^/(?:\.well-known/|nodeinfo|users/|inbox) {
        proxy_pass http://mithic_backend;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        $connection_upgrade;
    }

    # ---- OGP: ボットは backend の HTML、ブラウザは SPA ----
    # if 内は "rewrite ... last" のみ（nginx の If-is-Evil 安全リスト）。
    # 内部接頭辞 /__ogp/ に飛ばし、proxy_pass の URI 置換で元パスに戻す。
    location ~ ^/(?:notes|profile)/ {
        if ($ogp_bot) {
            rewrite ^/(.*)$ /__ogp/$1 last;
        }
        try_files $uri $uri/ /index.html;
    }

    location ^~ /__ogp/ {
        internal;
        proxy_pass http://mithic_backend/;   # /__ogp/ を / に置換 → backend は元パスを受ける
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ---- hashed trunk assets: immutable（拡張子一律より前に置くこと）----
    location ~ ^/(?:frontend|main)-[^/]+\.(?:js|wasm|css)$ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # ---- Service Worker: no-cache ----
    location = /sw.js {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    # ---- その他の static は SPA フォールバックしない（欠落は 404）----
    location ~* \.(?:css|js|wasm|map|png|jpe?g|webp|svg|ico|woff2|webmanifest)$ {
        try_files $uri =404;
    }

    # ---- index.html: no-cache ----
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # ---- SPA fallback（最後）----
    location / {
        try_files $uri $uri/ /index.html;
    }
}

# Mithic development docker-compose
name: mithic

services:
  # PostgreSQL 16 + WAL archive。
  # 冗長構成は primary + WAL archive とし、compose 同一ホスト内に standby は置かない
  # (ホスト障害に対処できないため)。PITR は pg_wal_archive を別ホストへ退避して
  # pgBackRest / Barman を組む運用を想定する。
  db:
    image: postgres:16-alpine
    container_name: mithic-db
    restart: unless-stopped
    command:
      - postgres
      - -c
      - listen_addresses=*
      - -c
      - archive_mode=on
      - -c
      - archive_command=test ! -f /var/lib/postgresql/data/pg_wal_archive/%f && cp %p /var/lib/postgresql/data/pg_wal_archive/%f
      - -c
      - wal_level=replica
      - -c
      - max_wal_senders=10
    environment:
      POSTGRES_USER: mithic
      POSTGRES_PASSWORD: mithic-dev-password
      POSTGRES_DB: mithic
    volumes:
      - db_data:/var/lib/postgresql/data
      - pg_wal_archive:/var/lib/postgresql/data/pg_wal_archive
    ports:
      - '5432:5432'   # dual-stack (IPv4 限定だと localhost が [::1] のときに接続拒否になる)
    networks:
      - mithic
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U mithic -d mithic']
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:8-alpine
    container_name: mithic-redis
    restart: unless-stopped
    command: ['redis-server', '--maxmemory', '2gb']
    volumes:
      - redis_data:/data
    ports:
      - '6379:6379'
    networks:
      - mithic
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
      # Docker の bridge ネットワークから github.com への接続がハング/切断される
      # 環境があるため、ビルドは host ネットワークで実行する（外部取得の確実性のため）
      network: host
    container_name: mithic-backend
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: postgres://mithic:mithic-dev-password@db:5432/mithic
      DATABASE_POOL_MAX: ${DATABASE_POOL_MAX:-10}
      REDIS_URL: redis://redis:6379
      STORAGE_S3_ENABLED: ${STORAGE_S3_ENABLED:-false}
      LOCAL_STORAGE_PATH: \
    volumes:
      - media_files:/app/files
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - mithic
    healthcheck:
      test: ['CMD-SHELL', 'curl -fs http://localhost:3000/api/v1/health || exit 1']
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s

  # WASM dist をビルドして frontend_dist へ同期するだけ（サーバーは持たない）。
  # 正常終了するビルドサイドカー。restart は no 必須（unless-stopped だと同期がループする）。
  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      network: host
    restart: "no"
    command: ['sh', '-c', 'rm -rf /out/* && cp -a /dist/. /out/']
    volumes:
      - frontend_dist:/out
    networks:
      - mithic

  # Static SPA + 逆 proxy（compose で公式イメージを管理。設定は ./nginx.conf を bind mount）
  proxy:
    image: nginx:alpine
    container_name: mithic-proxy
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_completed_successfully
    ports:
      - '3000:80'   # dual-stack（Edge は localhost を [::1] に解決するため IPv4 限定は不可）
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - frontend_dist:/usr/share/nginx/html:ro
    networks:
      - mithic
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://127.0.0.1/']
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 5s

volumes:
  db_data:
  pg_wal_archive:
  redis_data:
  frontend_dist:
  media_files:

networks:
  mithic:
    driver: bridge

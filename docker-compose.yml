name: mithic

services:
  # ---------------------------------------------------------------------------
  # Infrastructure
  # ---------------------------------------------------------------------------
  surrealdb:
    image: surrealdb/surrealdb:latest
    container_name: mithic-surrealdb
    restart: unless-stopped
    user: "0:0"
    command:
      - start
      - --log=info
      - --bind=0.0.0.0:8000
      - --user=${SURREALDB_USERNAME:-root}
      - --pass=${SURREALDB_PASSWORD:-root}
      - surrealkv:/data/surrealdb
    volumes:
      - surrealdb_data:/data/surrealdb
    ports:
      - "8000:8000"
    networks:
      - mithic
    healthcheck:
      test: ["CMD", "/surreal", "is-ready", "--endpoint", "http://localhost:8000"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  dragonfly:
    image: docker.dragonflydb.io/dragonflydb/dragonfly:latest
    container_name: mithic-dragonfly
    restart: unless-stopped
    ulimits:
      memlock: -1
    volumes:
      - dragonfly_data:/data
    ports:
      - "6379:6379"
    networks:
      - mithic
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ---------------------------------------------------------------------------
  # RustFS (S3 互換). 通常は起動しない。有効化はこのブロックのコメントを外す。
  # 結合テストはコンテナを自前で起動する:
  #   cargo test -p mithic-server --lib rustfs_put_get -- --ignored
  # バケットは初回だけ作る:
  #   docker run --rm --network mithic -e AWS_ACCESS_KEY_ID=mithic -e AWS_SECRET_ACCESS_KEY=mithic-dev-secret -e AWS_DEFAULT_REGION=us-east-1 amazon/aws-cli s3 mb s3://mithic-media --endpoint-url http://rustfs:9000
  # ---------------------------------------------------------------------------
  # rustfs:
  #   image: rustfs/rustfs:latest
  #   container_name: mithic-rustfs
  #   restart: unless-stopped
  #   command: ["/data"]
  #   environment:
  #     RUSTFS_ACCESS_KEY: mithic
  #     RUSTFS_SECRET_KEY: mithic-dev-secret
  #     RUSTFS_ADDRESS: ":9000"
  #     RUSTFS_CONSOLE_ADDRESS: ":9001"
  #     RUSTFS_CONSOLE_ENABLE: "true"
  #   volumes:
  #     - rustfs_data:/data
  #   ports:
  #     - "9000:9000"
  #     - "9001:9001"
  #   networks:
  #     - mithic

  # ---------------------------------------------------------------------------
  # Application
  # ---------------------------------------------------------------------------
  backend:
    build:
      context: .
      target: backend
    container_name: mithic-backend
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    environment:
      SURREALDB_ENDPOINT: ws://surrealdb:8000
      DRAGONFLY_URL: redis://dragonfly:6379
      # デフォルトはローカル FS。外部 S3 / RustFS は .env の STORAGE_TYPE / STORAGE_S3_*
      STORAGE_TYPE: ${STORAGE_TYPE:-local}
      LOCAL_STORAGE_PATH: ${LOCAL_STORAGE_PATH:-/app/files}
      # RustFS を使うとき (下の rustfs コメントを外してから):
      # STORAGE_TYPE: s3
      # STORAGE_S3_ENDPOINT: http://rustfs:9000
      # STORAGE_S3_BUCKET: mithic-media
      # STORAGE_S3_ACCESS_KEY: mithic
      # STORAGE_S3_SECRET_KEY: mithic-dev-secret
      # STORAGE_S3_REGION: us-east-1
    volumes:
      - media_files:/app/files
    depends_on:
      surrealdb:
        condition: service_healthy
      dragonfly:
        condition: service_healthy
    networks:
      - mithic
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://localhost:3000/api/v1/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s

  frontend:
    build:
      context: .
      target: frontend
    container_name: mithic-frontend
    restart: unless-stopped
    ports:
      - "80:80"
      - "3000:3000"
      - "443:443"
    volumes:
      # Apply Caddyfile without rebuilding the WASM image
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - mithic
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/api/v1/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 5s

# -----------------------------------------------------------------------------
# Volumes
# -----------------------------------------------------------------------------
volumes:
  surrealdb_data:
  dragonfly_data:
  media_files:
  rustfs_data:

# -----------------------------------------------------------------------------
# Networks
# -----------------------------------------------------------------------------
networks:
  mithic:
    driver: bridge

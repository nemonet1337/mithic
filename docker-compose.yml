# Mithic development docker-compose
name: mithic

services:
  surrealdb:
    image: surrealdb/surrealdb:v3
    container_name: mithic-surrealdb
    restart: unless-stopped
    command: ['start', '--user', 'root', '--pass', 'root', 'surrealkv:/data']
    volumes:
      - surrealdb_data:/data
    ports:
      - '8000:8000'
    networks:
      - mithic
    healthcheck:
      test: ['CMD', '/surreal', 'version']
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:8-alpine
    container_name: mithic-redis
    restart: unless-stopped
    command: ['redis-server', '--maxmemory', '2gb']
    volumes:
      - redis_data:/data
    ports:
      - '6379:6379'
    networks:
      - mithic
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: mithic-backend
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    environment:
      SURREALDB_ENDPOINT: ws://surrealdb:8000
      DRAGONFLY_URL: redis://redis:6379
      STORAGE_S3_ENABLED: ${STORAGE_S3_ENABLED:-false}
      LOCAL_STORAGE_PATH: \
    volumes:
      - media_files:/app/files
    depends_on:
      surrealdb:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - mithic
    healthcheck:
      test: ['CMD-SHELL', 'curl -fs http://localhost:3000/api/v1/health || exit 1']
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s

  # WASM dist をビルドして frontend_dist へ同期するだけ（サーバーは持たない）。
  # 正常終了するビルドサイドカー。restart は no 必須（unless-stopped だと同期がループする）。
  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    restart: "no"
    command: ['sh', '-c', 'rm -rf /out/* && cp -a /dist/. /out/']
    volumes:
      - frontend_dist:/out
    networks:
      - mithic

  # Static SPA + 逆 proxy（compose で公式イメージを管理。設定は ./nginx.conf を bind mount）
  proxy:
    image: nginx:alpine
    container_name: mithic-proxy
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_completed_successfully
    ports:
      - '3000:80'   # dual-stack（Edge は localhost を [::1] に解決するため IPv4 限定は不可）
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - frontend_dist:/usr/share/nginx/html:ro
    networks:
      - mithic
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://127.0.0.1/']
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 5s

volumes:
  surrealdb_data:
  redis_data:
  frontend_dist:
  media_files:

networks:
  mithic:
    driver: bridge

# Mithic development docker-compose
name: mithic

services:
  surrealdb:
    image: surrealdb/surrealdb:v3
    container_name: mithic-surrealdb
    restart: unless-stopped
    command: ['start', '--user', 'root', '--pass', 'root', 'surrealkv:/data']
    volumes:
      - surrealdb_data:/data
    ports:
      - '8000:8000'
    networks:
      - mithic
    healthcheck:
      test: ['CMD', '/surreal', 'version']
      interval: 10s
      timeout: 5s
      retries: 5

  dragonfly:
    image: docker.dragonflydb.io/dragonflydb/dragonfly
    container_name: mithic-dragonfly
    restart: unless-stopped
    command: ['--maxmemory', '2gb']
    volumes:
      - dragonfly_data:/data
    ports:
      - '6379:6379'
    networks:
      - mithic
    healthcheck:
      test: ['CMD-SHELL', 'redis-cli -h 127.0.0.1 -p 6379 ping']
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      target: backend
    container_name: mithic-backend
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    environment:
      SURREALDB_ENDPOINT: ws://surrealdb:8000
      DRAGONFLY_URL: redis://dragonfly:6379
      STORAGE_S3_ENABLED: ${STORAGE_S3_ENABLED:-false}
      LOCAL_STORAGE_PATH: \
    volumes:
      - media_files:/app/files
    depends_on:
      surrealdb:
        condition: service_healthy
      dragonfly:
        condition: service_healthy
    networks:
      - mithic
    healthcheck:
      test: ['CMD-SHELL', 'curl -fs http://localhost:3000/api/v1/health || exit 1']
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s

  frontend:
    build:
      context: .
      target: frontend
    container_name: mithic-frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - mithic
    healthcheck:
      test: ['CMD-SHELL', 'wget -qO- http://127.0.0.1:3000/api/v1/health || exit 1']
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 5s

  proxy:
    build:
      context: .
      target: frontend
    container_name: mithic-proxy
    restart: unless-stopped
    depends_on:
      frontend:
        condition: service_healthy
    ports:
      - '3000:3000'
    networks:
      - mithic
    healthcheck:
      test: ['CMD', 'curl', '-fs', 'http://127.0.0.1:3000/']
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 5s

volumes:
  surrealdb_data:
  dragonfly_data:
  media_files:

networks:
  mithic:
    driver: bridge

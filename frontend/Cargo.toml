[package]
name = "frontend"
version = "0.1.0"
edition.workspace = true
authors.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
leptos = { version = "0.7", default-features = false, features = ["csr"] }
leptos_router = { version = "0.7", default-features = false }
gloo-net = { version = "0.6", features = ["http", "websocket"] }
gloo-timers = { version = "0.3", features = ["futures"] }
gloo-storage = "0.3"
leptos_icons = "0.4"
icondata = "0.7"
serde.workspace = true
serde_json.workspace = true
shared = { path = "../shared" }
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
web-sys = { version = "0.3", features = [
    "console",
    "Blob",
    "CloseEvent",
    "DataTransfer",
    "Document",
    "DomTokenList",
    "DragEvent",
    "Element",
    "Event",
    "File",
    "FileList",
    "FormData",
    "Headers",
    "HtmlBodyElement",
    "HtmlInputElement",
    "HtmlSelectElement",
    "HtmlTextAreaElement",
    "IntersectionObserver",
    "IntersectionObserverEntry",
    "IntersectionObserverInit",
    "KeyboardEvent",
    "MessageEvent",
    "Request",
    "RequestInit",
    "RequestMode",
    "Response",
    "Url",
    "WebSocket",
    "Window",
    "MediaQueryList",
] }
console_error_panic_hook = "0.1"
getrandom = { version = "0.3", features = ["wasm_js"] }
comrak = "0.31"
leptos_i18n = "0.5"

[features]
default = ["csr"]
csr = ["leptos/csr"]
ssr = ["leptos/ssr", "leptos_router/ssr"]

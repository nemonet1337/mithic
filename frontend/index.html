<!doctype html>
<html lang="ja" class="dark">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <meta name="theme-color" content="#16151a" />
        <meta name="description" content="Mithic — 分散型 SNS。signal not noise。" />
        <meta name="mobile-web-app-capable" content="yes" />
        <meta name="apple-mobile-web-app-capable" content="yes" />
        <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
        <meta name="apple-mobile-web-app-title" content="Mithic" />
        <title>Mithic</title>
        <!-- PWA Manifest -->
        <link rel="manifest" href="/manifest.webmanifest" />
        <link rel="apple-touch-icon" href="/icon-192.png" />
        <!-- Fonts -->
        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
        <link
            href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,wght@0,400;0,500;0,600;0,700;1,600&family=JetBrains+Mono:wght@400;600&display=swap"
            rel="stylesheet"
        />
        <!-- Tailwind (built by Trunk via standalone CLI, no Node.js) -->
        <link data-trunk rel="tailwind-css" href="style/main.css" />
        <!-- Rust/WASM app -->
        <link data-trunk rel="rust" />
        <link data-trunk rel="copy-dir" href="public" />
    </head>
    <body>
        <!-- Service Worker -->
        <script>
            if ('serviceWorker' in navigator) {
                window.addEventListener('load', () => {
                    navigator.serviceWorker.register('/sw.js', { scope: '/' })
                        .then(reg => console.log('[SW] registered', reg.scope))
                        .catch(err => console.warn('[SW] registration failed', err));
                });
            }
            // テーマ復元: .dark クラス方式 (キーは mithic.theme を継続)
            (function () {
                try {
                    const t = localStorage.getItem('mithic.theme');
                    const root = document.documentElement;
                    if (t === 'light') {
                        root.classList.remove('dark');
                    } else {
                        root.classList.add('dark');
                    }
                } catch (_) {}
            })();
        </script>
    </body>
</html>

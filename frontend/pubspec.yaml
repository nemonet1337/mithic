name: mithic
description: Mithic - A federated social media app
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.2
  http: ^1.1.0
  go_router: ^12.0.0
  flutter_riverpod: ^2.4.0
  riverpod_annotation: ^2.2.0
  freezed_annotation: ^2.4.1
  json_annotation: ^4.8.1
  shared_preferences: ^2.2.0
  url_launcher: ^6.1.0
  image_picker: ^1.0.0
  dio: ^5.4.0
  flutter_secure_storage: ^9.0.0
  cached_network_image: ^3.3.0
  web_socket_channel: ^2.4.0
  intl: ^0.20.2
  timeago: ^3.6.0
  flutter_svg: ^2.0.9
  google_fonts: ^6.1.0
  lucide_icons: ^0.257.0
  flutter_animate: ^4.3.0
  animations: ^2.0.11

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  build_runner: ^2.4.0
  freezed: ^2.4.0
  json_serializable: ^6.7.0
  riverpod_generator: ^2.3.0

flutter:
  uses-material-design: true
  generate: true

flutter_intl:
  enabled: true

<!doctype html>
<html lang="ja" data-theme="night">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <meta name="theme-color" content="#7c3aed" />
        <meta name="description" content="Mithic — 分散型 SNS。signal not noise。" />
        <meta name="mobile-web-app-capable" content="yes" />
        <meta name="apple-mobile-web-app-capable" content="yes" />
        <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
        <meta name="apple-mobile-web-app-title" content="Mithic" />
        <title>Mithic</title>
        <!-- PWA Manifest -->
        <link rel="manifest" href="/manifest.webmanifest" />
        <!-- Apple Touch Icon (SVG fallback) -->
        <link rel="apple-touch-icon" href="/icon-192.png" />
        <!-- Fonts -->
        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
        <link
            href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;600&display=swap"
            rel="stylesheet"
        />
        <!-- Tailwind + DaisyUI (compiled by trunk) -->
        <link data-trunk rel="tailwind-css" href="style/main.css" />
        <!-- Rust/WASM app -->
        <link data-trunk rel="rust" />
        <!-- Static public files (manifest, sw.js, offline.html) -->
        <link data-trunk rel="copy-dir" href="public" />
    </head>
    <body>
        <!-- Service Worker 登録 -->
        <script>
            if ('serviceWorker' in navigator) {
                window.addEventListener('load', () => {
                    navigator.serviceWorker.register('/sw.js', { scope: '/' })
                        .then(reg => console.log('[SW] registered', reg.scope))
                        .catch(err => console.warn('[SW] registration failed', err));
                });
            }
            // テーマの初期化（LocalStorage から復元）
            (function () {
                try {
                    const t = localStorage.getItem('mithic.theme');
                    if (t === 'light') {
                        document.documentElement.setAttribute('data-theme', 'light');
                    } else {
                        document.documentElement.setAttribute('data-theme', 'night');
                    }
                } catch (_) {}
            })();
        </script>
    </body>
</html>

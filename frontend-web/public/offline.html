<!doctype html>
<html lang="ja" data-theme="night">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Mithic — オフライン</title>
    <style>
      :root {
        --bg: #0d1117;
        --surface: #161b22;
        --text: #e6edf3;
        --muted: #8b949e;
        --accent: #7c3aed;
      }
      * { box-sizing: border-box; margin: 0; padding: 0; }
      body {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background: var(--bg);
        color: var(--text);
        min-height: 100dvh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px;
      }
      .card {
        background: var(--surface);
        border: 1px solid rgba(255,255,255,0.1);
        border-radius: 16px;
        padding: 48px 40px;
        text-align: center;
        max-width: 420px;
        width: 100%;
      }
      .logo {
        font-size: 40px;
        font-weight: 800;
        color: var(--accent);
        margin-bottom: 24px;
        letter-spacing: -2px;
      }
      h1 {
        font-size: 22px;
        margin-bottom: 12px;
      }
      p {
        color: var(--muted);
        font-size: 14px;
        line-height: 1.6;
        margin-bottom: 32px;
      }
      .btn {
        display: inline-block;
        padding: 12px 32px;
        background: var(--accent);
        color: #fff;
        border-radius: 9999px;
        font-weight: 600;
        font-size: 14px;
        text-decoration: none;
        transition: opacity 0.2s;
      }
      .btn:hover { opacity: 0.85; }
    </style>
  </head>
  <body>
    <div class="card">
      <div class="logo">[m]</div>
      <h1>オフラインです</h1>
      <p>
        インターネット接続が検出できませんでした。<br />
        接続を確認してから再度お試しください。
      </p>
      <a href="/" class="btn">再接続して開く</a>
    </div>
  </body>
</html>

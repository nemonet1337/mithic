services:
  devcontainer:
    platform: linux/amd64
    build:
      context: .devcontainer
      dockerfile: Dockerfile
    volumes:
      - .:/workspace:cached
    # 開発コンテナが終了しないようにする設定
    command: sleep infinity
    environment:
      - SURREALDB_ENDPOINT=ws://surrealdb:8000
      - DRAGONFLY_URL=redis://dragonfly:6379
      - JWT_SECRET=mithic-dev-secret-key-just-for-testing-purposes-only
      - SERVER_PORT=3000
      - CORS_ALLOWED_ORIGINS=http://localhost:1420,http://127.0.0.1:1420,http://localhost
      - STORAGE_TYPE=local
      - LOCAL_STORAGE_PATH=/workspace/storage
      - INSTANCE_URL=http://localhost:1420
    networks:
      - mithic
